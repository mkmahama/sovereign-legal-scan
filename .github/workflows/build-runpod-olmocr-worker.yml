name: Build Runpod olmOCR worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "runpod/olmocr-worker/**"
      - ".github/workflows/build-runpod-olmocr-worker.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize runner disk space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 10240
          swap-size-mb: 1024
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          overprovision-lvm: "true"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          docker system prune -af || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: runpod/olmocr-worker
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/olmocr-runpod-worker:latest
          no-cache: true
