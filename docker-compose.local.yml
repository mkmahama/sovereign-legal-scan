services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sovereign}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sovereign_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-sovereign_legal}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - sovereign-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  postgres-seed:
    image: node:22-alpine
    working_dir: /app
    command: ["npm", "run", "seed:postgres"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sovereign}:${POSTGRES_PASSWORD:-sovereign_dev_password}@postgres:5432/${POSTGRES_DB:-sovereign_legal}
      SEED_TEST_PASSWORD: ${SEED_TEST_PASSWORD:-SovereignTest123!}
      SEED_RESET: ${SEED_RESET:-false}
    volumes:
      - ./scripts:/app/scripts:ro
      - ./server:/app/server:ro
      - ./node_modules:/app/node_modules:ro
      - ./package.json:/app/package.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  sovereign-legal:
    image: node:22-alpine
    working_dir: /app
    command: ["node", "dist/server.cjs"]
    ports:
      - "${APP_PORT:-3004}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      VITE_DEMO_MODE: "false"
      VITE_AUTH_MODE: "postgres"
      AUTH_MODE: "postgres"
      DATA_STORE: "postgres"
      DATABASE_URL: postgres://${POSTGRES_USER:-sovereign}:${POSTGRES_PASSWORD:-sovereign_dev_password}@postgres:5432/${POSTGRES_DB:-sovereign_legal}
      LOCAL_AUTH_SECRET: ${LOCAL_AUTH_SECRET:-sovereign-local-dev-secret}
      CHAT_PROVIDER: ${CHAT_PROVIDER:-ollama}
      OCR_PROVIDER: ${OCR_PROVIDER:-ollama}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-gemma4:latest}
      OLLAMA_OCR_MODEL: ${OLLAMA_OCR_MODEL:-gemma4:latest}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      CONFIG_ENCRYPTION_KEY: ${CONFIG_ENCRYPTION_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLMOCR_PROVIDER: ${OLMOCR_PROVIDER:-disabled}
      OLMOCR_SERVER_URL: ${OLMOCR_SERVER_URL:-}
      OLMOCR_MODEL: ${OLMOCR_MODEL:-allenai/olmOCR-2-7B-1025-FP8}
      OLMOCR_API_KEY: ${OLMOCR_API_KEY:-}
      SCANNER_WEBHOOK_SECRET: ${SCANNER_WEBHOOK_SECRET:-}
      PLATFORM_ADMIN_UIDS: ${PLATFORM_ADMIN_UIDS:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      LAWS_AFRICA_API_TOKEN: ${LAWS_AFRICA_API_TOKEN:-}
      LAWS_AFRICA_API_BASE_URL: ${LAWS_AFRICA_API_BASE_URL:-https://api.laws.africa}
      LAWS_AFRICA_JUDGMENTS_KB_CODE: ${LAWS_AFRICA_JUDGMENTS_KB_CODE:-judgments-gh}
      LAWS_AFRICA_LEGISLATION_KB_CODE: ${LAWS_AFRICA_LEGISLATION_KB_CODE:-legislation-gh}
    volumes:
      - ./dist:/app/dist:ro
      - ./node_modules:/app/node_modules:ro
      - ./package.json:/app/package.json:ro
      - ./firebase-applet-config.json:/app/firebase-applet-config.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      postgres-seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  firebase-seed:
    profiles: ["seed"]
    image: node:22-alpine
    working_dir: /app
    command: ["npm", "run", "seed:firebase"]
    environment:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      SEED_TEST_PASSWORD: ${SEED_TEST_PASSWORD:-SovereignTest123!}
      SEED_RESET: ${SEED_RESET:-false}
    volumes:
      - ./scripts:/app/scripts:ro
      - ./node_modules:/app/node_modules:ro
      - ./package.json:/app/package.json:ro
      - ./firebase-applet-config.json:/app/firebase-applet-config.json:ro
    restart: "no"

volumes:
  sovereign-postgres-data:
